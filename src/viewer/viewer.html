<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Viewer for agentic PDFs — visual PDF plus its hidden agent-readable layer.">
<meta property="og:title" content="Agentic PDF Viewer">
<meta property="og:description" content="View the visual PDF and its hidden agent-readable markdown layer side by side.">
<title>Agentic PDF Viewer</title>
<style>
  :root { --bg:#111; --panel:#1b1b1f; --fg:#e8e8ea; --accent:#6c8cff; --muted:#9a9aa2; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--fg); height:100vh; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px; background:var(--panel); border-bottom:1px solid #2a2a30; }
  header h1 { font-size:14px; font-weight:600; margin:0; }
  .badge { font-size:11px; padding:3px 8px; border-radius:999px; border:1px solid #3a3a42; color:var(--muted); }
  .badge.ok { color:#7ee787; border-color:#2ea04366; }
  #toggle-agent { margin-left:auto; background:var(--accent); color:#fff; border:none; padding:7px 14px; border-radius:8px; cursor:pointer; font-size:13px; }
  #toggle-agent.off { background:#33333a; color:var(--fg); }
  main { flex:1; display:flex; overflow:hidden; }
  #pdf-pane { flex:1.4; overflow-y:auto; padding:16px; scroll-behavior:smooth; }
  #pdf-pane canvas { display:block; margin:0 auto 16px; max-width:100%; box-shadow:0 4px 24px rgba(0,0,0,.5); background:#fff; border-radius:4px; }
  #agent-pane { flex:1; min-width:380px; border-left:1px solid #2a2a30; display:flex; flex-direction:column; background:var(--panel); }
  #agent-pane.hidden { display:none; }
  .tabs { display:flex; border-bottom:1px solid #2a2a30; }
  .tabs button { flex:1; background:none; border:none; color:var(--muted); padding:9px; font-size:12px; cursor:pointer; border-bottom:2px solid transparent; }
  .tabs button.active { color:var(--fg); border-bottom-color:var(--accent); }
  #agent-content, #agent-raw { flex:1; overflow-y:auto; padding:18px 20px; }
  #agent-content { line-height:1.65; font-size:14px; }
  #agent-content h1 { font-size:22px; } #agent-content h2 { font-size:17px; margin-top:1.6em; border-bottom:1px solid #2e2e35; padding-bottom:4px;} 
  #agent-content h3,#agent-content h4 { font-size:14px; color:var(--muted); }
  #agent-content code { background:#26262c; padding:2px 5px; border-radius:4px; font-size:12px; }
  #agent-content pre { background:#222228; padding:12px; border-radius:8px; overflow-x:auto; }
  #agent-content a { color:var(--accent); }
  #agent-content blockquote { border-left:3px solid var(--accent); margin-left:0; padding-left:12px; color:var(--muted); }
  #agent-raw { margin:0; font-family:"SF Mono",Menlo,monospace; font-size:12px; white-space:pre-wrap; word-break:break-word; color:#c8e1ff; }
  .fm { background:#20202a; border:1px solid #30303a; border-radius:8px; padding:10px 12px; margin-bottom:16px; font-family:monospace; font-size:11px; color:var(--muted); white-space:pre-wrap;}
</style>
</head>
<body>
<header>
  <h1>Agentic PDF Viewer</h1>
  <span class="badge" id="layer-badge">checking…</span>
  <button id="toggle-agent">Agent layer</button>
</header>
<main>
  <div id="pdf-pane"></div>
  <aside id="agent-pane" class="hidden">
    <div class="tabs">
      <button id="tab-rendered" class="active">Rendered</button>
      <button id="tab-raw">Raw markdown</button>
    </div>
    <div id="agent-content"><p style="color:var(--muted)">No agentic layer in this document.</p></div>
    <pre id="agent-raw" hidden></pre>
  </aside>
</main>
<script type="module">
  import * as pdfjsLib from "/vendor/pdf.mjs";
  import { marked } from "/vendor/marked.min.js";

  pdfjsLib.GlobalWorkerOptions.workerSrc = "/vendor/pdf.worker.mjs";

  const meta = await fetch("/meta.json").then(r => r.json());
  const badge = document.getElementById("layer-badge");
  if (meta.hasAgentLayer) {
    badge.textContent = "agentic layer ✔";
    badge.classList.add("ok");
  } else {
    badge.textContent = "no agentic layer";
    document.getElementById("toggle-agent").disabled = true;
  }

  // Render PDF pages
  const pane = document.getElementById("pdf-pane");
  const doc = await pdfjsLib.getDocument("/doc.pdf").promise;
  for (let i = 1; i <= doc.numPages; i++) {
    const page = await doc.getPage(i);
    const base = page.getViewport({ scale: 1 });
    const scale = Math.min(1.6, (pane.clientWidth - 32) / base.width);
    const viewport = page.getViewport({ scale });
    const canvas = document.createElement("canvas");
    canvas.width = viewport.width * devicePixelRatio;
    canvas.height = viewport.height * devicePixelRatio;
    canvas.style.width = viewport.width + "px";
    canvas.style.height = viewport.height + "px";
    pane.appendChild(canvas);
    await page.render({ canvasContext: canvas.getContext("2d"), ...(devicePixelRatio !== 1 ? { transform: [devicePixelRatio,0,0,devicePixelRatio,0,0] } : {}), viewport }).promise;
  }

  // Agent panel
  let md = null;
  async function loadAgent() {
    if (md !== null) return md;
    const res = await fetch("/agent.md");
    md = res.ok ? await res.text() : "";
    return md;
  }

  const agentPane = document.getElementById("agent-pane");
  const toggleBtn = document.getElementById("toggle-agent");
  toggleBtn.onclick = () => {
    agentPane.classList.toggle("hidden");
    toggleBtn.classList.toggle("off");
  };

  const renderedEl = document.getElementById("agent-content");
  const rawEl = document.getElementById("agent-raw");
  const tabR = document.getElementById("tab-rendered");
  const tabW = document.getElementById("tab-raw");

  tabR.onclick = () => switchTab(true);
  tabW.onclick = () => switchTab(false);
  function switchTab(rendered) {
    tabR.classList.toggle("active", rendered);
    tabW.classList.toggle("active", !rendered);
    renderedEl.hidden = !rendered;
    rawEl.hidden = rendered;
  }

  if (meta.hasAgentLayer) {
    const text = await loadAgent();
    rawEl.textContent = text;

    // Split frontmatter into a metadata card
    const m = /^---\n([\s\S]*?)\n---\n/.exec(text);
    let body = text;
    if (m) {
      body = text.slice(m[0].length);
      const card = document.createElement("div");
      card.className = "fm";
      card.textContent = m[1];
      renderedEl.appendChild(card);
    }
    const html = marked.parse(body);
    const holder = document.createElement("div");
    holder.innerHTML = html;
    renderedEl.appendChild(holder);

    // auto-open on load when a layer exists
    agentPane.classList.remove("hidden");
    toggleBtn.classList.remove("off");
  }
</script>
</body>
</html>
